:root {

  --other: #b9b8b1;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b; --good-text: #006300;
  --brush: rgba(42,120,214,0.12);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.05);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --other: #5c5b56; --good-text: #0ca30c; --brush: rgba(57,135,229,0.18);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;

* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
main { max-width: 1180px; margin: 0 auto; padding: 20px 16px 64px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; margin-bottom: 12px; }

header .meta { color: var(--muted); font-size: 12px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 16px; position: sticky; top: 0; z-index: 5; background: var(--page); padding: 8px 0; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; color: var(--ink-2); padding: 6px 10px; font: inherit; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--wash); color: var(--ink); font-weight: 600; }
select, input[type="search"], .btn { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; }
.btn { cursor: pointer; color: var(--ink-2); }
.btn:hover, .seg button:hover { background: var(--wash); }
label.check { display: inline-flex; gap: 6px; align-items: center; color: var(--ink-2); }
.spacer { flex: 1; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
.card h2 { font-size: 15px; margin: 0 0 4px; }
.card .sub { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
.card-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.card-head .spacer { flex: 1; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 16px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
.tile .label { color: var(--ink-2); font-size: 12px; }
.tile .value { font-size: 26px; font-weight: 650; margin: 2px 0; letter-spacing: -0.01em; }
.tile .note { color: var(--muted); font-size: 12px; }
.meter { height: 8px; border-radius: 4px; background: var(--grid); overflow: hidden; margin: 8px 0 4px; }
.meter > span { display: block; height: 100%; border-radius: 4px; background: var(--s1); }
.status { display: inline-flex; gap: 4px; align-items: center; font-size: 12px; color: var(--ink-2); }
.status i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); margin-bottom: 6px; }
.legend button { background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.legend button[aria-pressed="false"] { opacity: 0.4; }
.key { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.tip { position: fixed; pointer-events: none; z-index: 20; background: var(--surface); color: var(--ink); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.12); max-width: 320px; display: none; }
.tip .t { color: var(--muted); margin-bottom: 4px; }
.tip .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.tip .row b { font-variant-numeric: tabular-nums; }
.tip .row span { display: inline-flex; gap: 6px; align-items: center; color: var(--ink-2); }
.tip ul { margin: 4px 0 0; padding-left: 16px; color: var(--ink-2); }
.projects { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.pcard { text-align: left; font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; cursor: pointer; }
.pcard[aria-pressed="true"] { border-color: var(--s1); box-shadow: 0 0 0 1px var(--s1) inset; }
.pcard .name { font-weight: 650; }
.chip { display: inline-block; font-size: 11px; color: var(--ink-2); border: 1px solid var(--border); border-radius: 999px; padding: 0 8px; margin-left: 6px; }
.pcard .nums { color: var(--ink-2); font-size: 12px; margin-top: 4px; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { color: var(--ink-2); font-weight: 600; font-size: 12px; white-space: nowrap; }
th button { all: unset; cursor: pointer; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr.item { cursor: pointer; }
tr.item:hover td { background: var(--wash); }
tr.detail td { background: var(--wash); color: var(--ink-2); font-size: 12px; }
td.title { max-width: 420px; }
.group-row td { color: var(--muted); font-size: 12px; padding-top: 12px; border-bottom: 0; }
.sim { display: grid; grid-template-columns: minmax(0, 1fr) minmax(220px, 300px); gap: 16px; }
.sim ul { list-style: none; margin: 0; padding: 0; max-height: 260px; overflow: auto; }
.sim li label { display: flex; gap: 8px; padding: 3px 0; color: var(--ink-2); }
.sim .result .value { font-size: 22px; font-weight: 650; }
.empty { color: var(--muted); padding: 24px 0; text-align: center; }
.hidden { display: none !important; }
.foot { color: var(--muted); font-size: 12px; margin-top: 24px; }
.questions { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 16px; margin-bottom: 16px; }
.q { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
.q h2 { font-size: 16px; margin: 0 0 10px; }
.q .big { font-size: 24px; font-weight: 650; letter-spacing: -0.01em; }
.q .line { display: flex; gap: 8px; align-items: baseline; padding: 6px 0; border-top: 1px solid var(--grid); }
.q .line:first-of-type { border-top: 0; }
.q button.line { all: unset; display: flex; gap: 8px; align-items: baseline; padding: 6px 0; border-top: 1px solid var(--grid); cursor: pointer; width: 100%; box-sizing: border-box; }
.q button.line:hover .pname, .q button.line:focus-visible .pname { text-decoration: underline; }
.q .pname { font-weight: 600; min-width: 84px; }
.q .say { color: var(--ink-2); flex: 1; }
.q .say b { color: var(--ink); font-weight: 650; }
.q .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; align-self: center; }
.q .hint { color: var(--muted); font-size: 12px; margin-top: 8px; }
.morebar { display: flex; justify-content: center; margin: 4px 0 16px; }
.info { all: unset; display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; margin-left: 6px; border-radius: 50%; border: 1px solid var(--axis); color: var(--muted); font-size: 11px; font-weight: 600; cursor: help; vertical-align: 1px; }
.info:hover, .info:focus-visible, .info[aria-expanded="true"] { color: var(--ink); border-color: var(--ink-2); }
.tip .help { color: var(--ink-2); white-space: pre-line; line-height: 1.5; }
details.glossary summary { cursor: pointer; font-weight: 600; font-size: 15px; }
details.glossary dl { display: grid; grid-template-columns: minmax(140px, 220px) 1fr; gap: 8px 16px; margin: 12px 0 0; font-size: 13px; }
details.glossary dt { font-weight: 600; }
details.glossary dd { margin: 0; color: var(--ink-2); white-space: pre-line; }
details.glossary h3 { grid-column: 1 / -1; font-size: 12px; color: var(--muted); margin: 12px 0 0; font-weight: 600; }
@media (max-width: 720px) { details.glossary dl { grid-template-columns: 1fr; } }
@media (max-width: 720px) { .sim { grid-template-columns: 1fr; } td.title { max-width: 200px; } }

    writeHash();
    renderControls();
    renderNavigation();
    $("projectMeta").classList.toggle("hidden", st.tab !== "projectTab");
    $("projectMeta").replaceChildren();
    const rows = filteredRows();
    if (st.tab === "overview") {
      renderKpis(rows);
      renderStatus();
      $("overviewSpend").replaceChildren(bars(rows, "project", costFor, 8));
      const models = aggregate(rows, "model"), total = models.reduce((a, x) => a + x[1], 0);
      $("overviewModels").replaceChildren(el("p", {}, t("byModel")), el("div", { class: "ratio" }, ...models.map(([n, v]) => el("button", { style: `width:${v / total * 100}%;background:${modelColor(n)}`, "aria-label": `${n} ${fmtUsd(v)}`, onclick: () => modelFor(n) }, ""))), ...models.map(([n, v]) => el("p", { class: "note" }, `${n} · ${total ? (v / total * 100).toFixed(1) : 0}%`)));
      renderAttention();
    }
    if (st.tab === "projectTab") {
      renderDetail();
      const box = $("detail");
      const picker = el("select", { "aria-label": t("projectTab"), class: "mobile-project", onchange: (e) => selectProject(e.target.value) }, ...DATA.projects.map((p2) => el("option", { value: p2.name, selected: p2.name === st.sel }, p2.name)));
      box.prepend(picker);
      const p = DATA.projects.find((p2) => p2.name === st.sel);
      if (p) {
        const usd = filteredRows(p.name).reduce((a, r) => a + r[4], 0);
        $("projectMeta").replaceChildren( `${t("lastActive")}: ${p.lastActive ? fmtTime(p.lastActive) : "—"} · ${t("spend")}: ${fmtUsd(usd)} · ${p.usdPerPoint == null ? t("noRate") : fmtUsd(p.usdPerPoint) + t("perPt") + " · " + t(p.rateBasis === "project" ? "rateProject" : "rateAll")}`);
        const items = box.querySelector(".items-table")?.closest("section");
        if (items) items.id = "itemsSection";
      }
    }
    if (st.tab === "costTab") {
      renderDaily(rows);
      renderDay(rows);
      $("costProjects").replaceChildren(bars(rows, "project", selectProject));
      $("costModels").replaceChildren(bars(rows, "model", modelFor));
    }
    if (st.tab === "limitsTab") renderLimits();
    renderGlossary();
    $("foot").textContent = `${t("estimate")} · ${t("prices")}: ${DATA.prices.source} (${DATA.prices.checked})${DATA.prices.unpriced.length ? " · " + t("unpriced") + ": " + DATA.prices.unpriced.join(", ") : ""}`;
    if (focusKey) [...document.querySelectorAll("[data-focus]")].find((n) => n.getAttribute("data-focus") === focusKey)?.focus({ preventScroll: true });
    main.scrollTop = scroll;
    for (const [i, top, left] of nested) {
      const n = document.querySelectorAll("#content ul, #content .table-wrap")[i];
      if (n) {
        n.scrollTop = top;
        n.scrollLeft = left;
      }
    }
  }
  $("stackBy").onchange = (e) => {
    st.stack = e.target.value;
    st.hidden = [];
    update();
  };
  $("csvBtn").onclick = () => {
    const rows = filteredRows().filter((r) => !st.hidden.includes(st.stack === "model" ? DATA.dims.models[r[2]] : DATA.dims.projects[r[1]]));
    const quote = (v) => '"' + String(v).replaceAll('"', '""') + '"';
    const csv = [[t("date"), t("projectTab"), t("stackModel"), t("imported"), "USD", t("tokens")], ...rows.map((r) => [r[0], DATA.dims.projects[r[1]], DATA.dims.models[r[2]], r[3], r[4], r[5]])].map((r) => r.map(quote).join(",")).join("\r\n");
    const url = URL.createObjectURL(new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" }));
    const a = el("a", { href: url, download: "scopeburn.csv" });
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1e3);
  };
  const controlUpdate = renderControls;
  renderControls = function() {
    controlUpdate();
    $("stackBy").replaceChildren(el("option", { value: "model" }, t("stackModel")), el("option", { value: "project" }, t("stackProject")));
    $("stackBy").value = st.stack;
    $("stackBy").setAttribute("aria-label", t("sortBy"));
  };
  new ResizeObserver(() => document.documentElement.style.setProperty("--header-height", $("mainHeader").offsetHeight + "px")).observe($("mainHeader"));
  document.addEventListener("keydown", (e) => {
    const typing = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
    if (e.key === "Escape") {
      st.open = [];
      st.day = null;
      $("glossary").open = false;
      pinnedInfo = null;
      touchPinned = false;
      hideTip();
      update();
      return;
    }
    if (typing || e.ctrlKey || e.altKey || e.metaKey) return;
    if (/^[1-4]$/.test(e.key)) {
      e.preventDefault();
      if (e.key === "2") st.sel ??= DATA.projects[0]?.name;
      go(tabs[Number(e.key) - 1]);
    }
    if (e.key === "/") {
      e.preventDefault();
      st.sel ??= DATA.projects[0]?.name;
      go("projectTab");
      document.querySelector("#detail input[type=search]")?.focus();
    }
  });
  let touchPinned = false;
  document.addEventListener("pointerdown", (e) => {
    touchPinned = false;
    if (e.pointerType === "touch") {
      if (!e.target.closest(".chart,.info,.ratio")) hideTip();
    }
  }, { capture: true });
  document.addEventListener("pointerup", (e) => {
    if (e.pointerType === "touch" && e.target.closest(".chart,.ratio")) touchPinned = true;
  });
  let rt;
  addEventListener("resize", () => {
    clearTimeout(rt);
    rt = setTimeout(update, 150);
  });
  addEventListener("hashchange", () => {
    readHash();
    update();
  });
  update();
  if (LIVE) setInterval(async () => {
    try {
      const r = await fetch("/data.json", { cache: "no-store" });
      if (!r.ok) return;
      const next = await r.json();
      if (JSON.stringify(next) === JSON.stringify(DATA)) return;
      DATA = next;
      projOpts = projectOptions();
      update();
      const n = $("liveStatus");
      n.classList.remove("blink");
      void n.offsetWidth;
      n.classList.add("blink");
    } catch {
    }
  }, 6e4);
})();
</script>
</body>
</html>

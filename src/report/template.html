<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scopeburn</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10); --wash: rgba(11,11,11,0.04);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
  --other: #b9b8b1;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b; --good-text: #006300;
  --brush: rgba(42,120,214,0.12);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.05);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --other: #5c5b56; --good-text: #0ca30c; --brush: rgba(57,135,229,0.18);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.05);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --other: #5c5b56; --good-text: #0ca30c; --brush: rgba(57,135,229,0.18);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
main { max-width: 1180px; margin: 0 auto; padding: 20px 16px 64px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; margin-bottom: 12px; }
header h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
header .meta { color: var(--muted); font-size: 12px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 16px; position: sticky; top: 0; z-index: 5; background: var(--page); padding: 8px 0; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; color: var(--ink-2); padding: 6px 10px; font: inherit; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--wash); color: var(--ink); font-weight: 600; }
select, input[type="search"], .btn { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; }
.btn { cursor: pointer; color: var(--ink-2); }
.btn:hover, .seg button:hover { background: var(--wash); }
label.check { display: inline-flex; gap: 6px; align-items: center; color: var(--ink-2); }
.spacer { flex: 1; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
.card h2 { font-size: 15px; margin: 0 0 4px; }
.card .sub { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
.card-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.card-head .spacer { flex: 1; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 16px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
.tile .label { color: var(--ink-2); font-size: 12px; }
.tile .value { font-size: 26px; font-weight: 650; margin: 2px 0; letter-spacing: -0.01em; }
.tile .note { color: var(--muted); font-size: 12px; }
.meter { height: 8px; border-radius: 4px; background: var(--grid); overflow: hidden; margin: 8px 0 4px; }
.meter > span { display: block; height: 100%; border-radius: 4px; background: var(--s1); }
.status { display: inline-flex; gap: 4px; align-items: center; font-size: 12px; color: var(--ink-2); }
.status i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); margin-bottom: 6px; }
.legend button { background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.legend button[aria-pressed="false"] { opacity: 0.4; }
.key { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.tip { position: fixed; pointer-events: none; z-index: 20; background: var(--surface); color: var(--ink); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.12); max-width: 320px; display: none; }
.tip .t { color: var(--muted); margin-bottom: 4px; }
.tip .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.tip .row b { font-variant-numeric: tabular-nums; }
.tip .row span { display: inline-flex; gap: 6px; align-items: center; color: var(--ink-2); }
.tip ul { margin: 4px 0 0; padding-left: 16px; color: var(--ink-2); }
.projects { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.pcard { text-align: left; font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; cursor: pointer; }
.pcard[aria-pressed="true"] { border-color: var(--s1); box-shadow: 0 0 0 1px var(--s1) inset; }
.pcard .name { font-weight: 650; }
.chip { display: inline-block; font-size: 11px; color: var(--ink-2); border: 1px solid var(--border); border-radius: 999px; padding: 0 8px; margin-left: 6px; }
.pcard .nums { color: var(--ink-2); font-size: 12px; margin-top: 4px; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { color: var(--ink-2); font-weight: 600; font-size: 12px; white-space: nowrap; }
th button { all: unset; cursor: pointer; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr.item { cursor: pointer; }
tr.item:hover td { background: var(--wash); }
tr.detail td { background: var(--wash); color: var(--ink-2); font-size: 12px; }
td.title { max-width: 420px; }
.group-row td { color: var(--muted); font-size: 12px; padding-top: 12px; border-bottom: 0; }
.sim { display: grid; grid-template-columns: minmax(0, 1fr) minmax(220px, 300px); gap: 16px; }
.sim ul { list-style: none; margin: 0; padding: 0; max-height: 260px; overflow: auto; }
.sim li label { display: flex; gap: 8px; padding: 3px 0; color: var(--ink-2); }
.sim .result .value { font-size: 22px; font-weight: 650; }
.empty { color: var(--muted); padding: 24px 0; text-align: center; }
.hidden { display: none !important; }
.foot { color: var(--muted); font-size: 12px; margin-top: 24px; }
@media (max-width: 720px) { .sim { grid-template-columns: 1fr; } td.title { max-width: 200px; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>scopeburn</h1>
    <span class="meta" id="meta"></span>
  </header>
  <div class="controls" role="toolbar">
    <div class="seg" id="period"></div>
    <select id="projectFilter" aria-label="project"></select>
    <select id="modelFilter" aria-label="model"></select>
    <label class="check"><input type="checkbox" id="imported"> <span data-i18n="imported"></span></label>
    <span class="spacer"></span>
    <button class="btn" id="langBtn"></button>
    <button class="btn" id="themeBtn"></button>
  </div>

  <section class="tiles" id="tiles"></section>

  <section class="card">
    <div class="card-head"><h2 data-i18n="dailySpend"></h2><span class="spacer"></span><button class="btn" id="dailyTableBtn" data-i18n="showTable"></button></div>
    <p class="sub" data-i18n="dailySpendSub"></p>
    <div class="legend" id="modelLegend"></div>
    <div class="chart" id="dailyChart"></div>
    <div id="dailyTable" class="hidden"></div>
  </section>

  <section class="card">
    <h2 data-i18n="byProject"></h2>
    <p class="sub" data-i18n="byProjectSub"></p>
    <div class="chart" id="projectChart"></div>
  </section>

  <section class="card">
    <h2 data-i18n="roadmaps"></h2>
    <p class="sub" data-i18n="roadmapsSub"></p>
    <div class="projects" id="projectCards"></div>
  </section>

  <section id="detail"></section>

  <p class="foot" id="foot"></p>
</main>
<div class="tip" id="tip" role="status"></div>
<script type="application/json" id="data">/*__SCOPEBURN_DATA__*/</script>
<script>
(() => {
'use strict';
let DATA = JSON.parse(document.getElementById('data').textContent);
const LIVE = /^https?:$/.test(location.protocol) && document.querySelector('meta[name="scopeburn-live"]');

// ---------- i18n ----------
const T = {
  en: {
    imported: 'include sessions run elsewhere', dailySpend: 'Daily Claude spend', dailySpendSub: 'API-equivalent USD per day, stacked by model',
    showTable: 'Table', showChart: 'Chart', byProject: 'Spend by project', byProjectSub: 'API-equivalent USD in the selected period',
    roadmaps: 'Roadmaps', roadmapsSub: 'Projects with a ROADMAP.md. Pick one for its burn-up and item costs.',
    spend: 'Spend (API-equivalent)', tokens: 'tokens', responses: 'responses', fiveHour: '5-hour window', weekly: 'Weekly window',
    noWindow: 'No active window', needsCal: 'Cap needs calibration', estCap: 'est. cap', resetsIn: 'resets in', reported: 'reported',
    hitsAt: 'cap reached around', underCap: 'stays under the cap at this rate', burn: 'burn', perHour: '/h', usedFee: '× your plan fee',
    allProjects: 'All projects', allModels: 'All models', period: { 7: '7d', 30: '30d', 90: '90d', 0: 'All' },
    scope: 'Scope', done: 'Done', cut: 'cut', open: 'open', pts: 'pts', burnup: 'Burn-up', burnupSub: 'Scope vs done, in size points. Drag to zoom.',
    resetZoom: 'Reset zoom', added: 'Added', completed: 'Completed', items: 'Items', search: 'Search items', status: 'Status', item: 'Item',
    size: 'Size', decided: 'Decided', finished: 'Done / cut', lead: 'Days', cost: 'Spend', statusOpen: 'Open', statusDone: 'Done', statusCut: 'Cut',
    statusPaused: 'Paused', statusActive: 'In progress', growth: 'growth', growthWarn: 'scope growing faster than work', waitingOld: 'waiting',
    simulate: 'What will it take to finish?', simulateSub: 'Uncheck items you might cut. Cost = points × median spend per point of finished items.',
    toFinish: 'to finish', windows: 'five-hour windows', noRate: 'Not enough finished items with spend yet (needs 5).',
    rateProject: 'this project', rateAll: 'all projects', perPt: '/pt', onRoadmap: 'on roadmap items', outside: 'outside the roadmap',
    viaCommits: 'via {ID} commits', parent: 'part of', start: 'started', paused: 'paused', lastActive: 'last Claude activity',
    days: 'd', ago: 'ago', today: 'today', none: 'Nothing in this period.', generated: 'Generated', prices: 'Prices', live: 'live',
    unpriced: 'No price for', total: 'Total', date: 'Date', other: 'Other', redacted: '',
  },
  ko: {
    imported: '다른 곳에서 실행된 세션 포함', dailySpend: '일별 Claude 사용 금액', dailySpendSub: 'API 가격 환산 USD, 모델별로 쌓음',
    showTable: '표로 보기', showChart: '차트로 보기', byProject: '프로젝트별 금액', byProjectSub: '선택한 기간의 API 가격 환산 USD',
    roadmaps: '로드맵', roadmapsSub: 'ROADMAP.md가 있는 프로젝트예요. 고르면 번업과 항목별 비용을 보여줘요.',
    spend: '사용 금액 (API 환산)', tokens: '토큰', responses: '응답', fiveHour: '5시간 구간', weekly: '주간 구간',
    noWindow: '진행 중인 구간 없음', needsCal: '한도 보정 필요', estCap: '추정 한도', resetsIn: '재설정까지', reported: '보고된 사용률',
    hitsAt: '이 속도면 한도 도달', underCap: '이 속도면 재설정 전까지 한도 안', burn: '소모', perHour: '/시간', usedFee: '× 구독료',
    allProjects: '모든 프로젝트', allModels: '모든 모델', period: { 7: '7일', 30: '30일', 90: '90일', 0: '전체' },
    scope: '범위', done: '완료', cut: '자름', open: '남음', pts: '점', burnup: '번업', burnupSub: '범위와 완료를 크기 점수로 그렸어요. 끌어서 확대할 수 있어요.',
    resetZoom: '확대 해제', added: '추가', completed: '완료', items: '항목', search: '항목 검색', status: '상태', item: '항목',
    size: '크기', decided: '결정', finished: '완료 / 자름', lead: '걸린 날', cost: '금액', statusOpen: '남음', statusDone: '완료', statusCut: '자름',
    statusPaused: '멈춤', statusActive: '진행 중', growth: '범위 증가율', growthWarn: '범위가 작업보다 빨리 늘어남', waitingOld: '대기',
    simulate: '끝내려면 얼마나 들까?', simulateSub: '자를 수도 있는 항목은 체크를 빼보세요. 비용 = 점수 × 완료 항목의 점당 비용 중앙값.',
    toFinish: '끝내는 데', windows: '5시간 구간', noRate: '비용이 기록된 완료 항목이 아직 부족해요 (5개 필요).',
    rateProject: '이 프로젝트', rateAll: '모든 프로젝트', perPt: '/점', onRoadmap: '로드맵 항목에 연결', outside: '로드맵 밖',
    viaCommits: '{ID} 커밋으로', parent: '상위 항목', start: '시작', paused: '멈춤', lastActive: '마지막 Claude 활동',
    days: '일', ago: '전', today: '오늘', none: '이 기간에는 기록이 없어요.', generated: '생성', prices: '단가', live: '실시간',
    unpriced: '단가 없음', total: '합계', date: '날짜', other: '기타', redacted: '',
  },
};

// ---------- state (URL hash) ----------
const st = { period: 30, project: 'all', model: 'all', imported: true, sel: null, lang: null, zoom: null, q: '', sort: 'decided', dir: 1, hidden: [], open: [], sim: {}, dailyTable: false };
function readHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.has('p')) st.period = Number(h.get('p')) || 0;
  if (h.has('proj')) st.project = h.get('proj');
  if (h.has('model')) st.model = h.get('model');
  if (h.has('imp')) st.imported = h.get('imp') !== '0';
  if (h.has('sel')) st.sel = h.get('sel');
  if (h.has('lang')) st.lang = h.get('lang');
}
function writeHash() {
  const h = new URLSearchParams({ p: st.period, proj: st.project, model: st.model, imp: st.imported ? 1 : 0 });
  if (st.sel) h.set('sel', st.sel);
  if (st.lang) h.set('lang', st.lang);
  history.replaceState(null, '', '#' + h.toString());
}
readHash();
const lang = () => st.lang || ((navigator.language || 'en').toLowerCase().startsWith('ko') ? 'ko' : 'en');
const t = (k) => (T[lang()] && T[lang()][k] != null ? T[lang()][k] : T.en[k]);

// ---------- helpers ----------
const $ = (id) => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return e;
}
function sv(tag, attrs, ...kids) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v != null) e.setAttribute(k, v);
  for (const c of kids.flat()) if (c != null) e.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return e;
}
const fmtUsd = (x) => {
  const c = DATA.config;
  const base = '$' + (x >= 1000 ? Math.round(x).toLocaleString() : x >= 100 ? x.toFixed(0) : x.toFixed(2));
  return c.currency && c.ratePerUsd ? `${base} (${Math.round(x * c.ratePerUsd).toLocaleString()} ${c.currency})` : base;
};
const fmtUsdShort = (x) => '$' + (x >= 1000 ? (x / 1000).toFixed(1) + 'k' : x >= 100 ? x.toFixed(0) : x >= 10 ? x.toFixed(1) : x.toFixed(2));
const fmtTok = (n) => (n >= 1e9 ? (n / 1e9).toFixed(2) + 'B' : n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'K' : String(Math.round(n)));
const dayMs = 86400000;
const toDate = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const dayStr = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const fmtTime = (ms) => { const d = new Date(ms); return `${dayStr(d)} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

// Model colors follow the model (its index in the full model list), never its rank in the current view.
function modelColor(name) {
  const i = DATA.dims.models.indexOf(name);
  return i >= 0 && i < 8 ? `var(--s${i + 1})` : 'var(--other)';
}

// ---------- tooltip ----------
const tip = $('tip');
function showTip(ev, build) {
  tip.replaceChildren(...build());
  tip.style.display = 'block';
  const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
  let x = ev.clientX + pad, y = ev.clientY + pad;
  if (x + w > innerWidth - 8) x = ev.clientX - w - pad;
  if (y + h > innerHeight - 8) y = ev.clientY - h - pad;
  tip.style.left = Math.max(8, x) + 'px';
  tip.style.top = Math.max(8, y) + 'px';
}
const hideTip = () => { tip.style.display = 'none'; };
const tipRow = (color, label, value) => el('div', { class: 'row' }, el('span', {}, color ? el('i', { class: 'key', style: `background:${color}` }) : null, label), el('b', {}, value));

// ---------- filtering ----------
function rangeStart() {
  if (!st.period) return null;
  const d = new Date(); d.setHours(0, 0, 0, 0);
  return dayStr(new Date(d.getTime() - (st.period - 1) * dayMs));
}
function filteredRows() {
  const from = rangeStart();
  const pi = st.project === 'all' ? -1 : DATA.dims.projects.indexOf(st.project);
  const mi = st.model === 'all' ? -1 : DATA.dims.models.indexOf(st.model);
  return DATA.daily.filter((r) => (!from || r[0] >= from) && (pi < 0 || r[1] === pi) && (mi < 0 || r[2] === mi) && (st.imported || !r[3]));
}

// ---------- controls ----------
function renderControls() {
  document.documentElement.lang = lang();
  for (const n of document.querySelectorAll('[data-i18n]')) n.textContent = t(n.dataset.i18n);
  $('dailyTableBtn').textContent = st.dailyTable ? t('showChart') : t('showTable');
  const per = $('period');
  per.replaceChildren(...[7, 30, 90, 0].map((p) => el('button', { 'aria-pressed': String(st.period === p), onclick: () => { st.period = p; update(); } }, t('period')[p])));
  const projTotals = new Map();
  for (const r of DATA.daily) projTotals.set(r[1], (projTotals.get(r[1]) || 0) + r[4]);
  const projOpts = [...projTotals].sort((a, b) => b[1] - a[1]).map(([i]) => DATA.dims.projects[i]);
  const ps = $('projectFilter');
  ps.replaceChildren(el('option', { value: 'all' }, t('allProjects')), ...projOpts.map((p) => el('option', { value: p, selected: st.project === p }, p)));
  ps.value = st.project;
  const ms = $('modelFilter');
  ms.replaceChildren(el('option', { value: 'all' }, t('allModels')), ...DATA.dims.models.map((m) => el('option', { value: m }, m)));
  ms.value = st.model;
  $('imported').checked = st.imported;
  $('langBtn').textContent = lang() === 'ko' ? 'English' : '한국어';
  const theme = document.documentElement.dataset.theme;
  $('themeBtn').textContent = theme === 'dark' ? '☀' : theme === 'light' ? '☾' : '◐';
  $('themeBtn').title = 'theme';
  $('meta').textContent = `${t('generated')} ${fmtTime(DATA.generatedAt)}${LIVE ? ' · ' + t('live') : ''}`;

      el('div', { class: 'label' }, `${t('toFinish')} ${pts} ${t('pts')}`),
      el('div', { class: 'value' }, fmtUsd(usd)),
      el('div', { class: 'note' }, `${fmtUsd(p.usdPerPoint)}${t('perPt')} · ${p.rateBasis === 'project' ? t('rateProject') : t('rateAll')}`),
      ...(cap ? [el('div', { class: 'note' }, `≈ ${(usd / cap).toFixed(1)} ${t('windows')}`)] : []));
  };
  recompute();
  return el('section', { class: 'card' },
    el('h2', {}, t('simulate')), el('p', { class: 'sub' }, t('simulateSub')),
    open.length ? el('div', { class: 'sim' },
      el('ul', {}, open.map((i) => el('li', {}, el('label', {}, el('input', { type: 'checkbox', checked: st.sim[i.key] !== false, onchange: (e) => { st.sim[i.key] = e.target.checked; recompute(); } }), `${i.title} · ${i.size}`)))),
      result) : el('div', { class: 'empty' }, '—'));
}

function statusOf(i) {
  if (i.status === 'done') return ['statusDone', 'var(--good)'];
  if (i.status === 'cut') return ['statusCut', 'var(--muted)'];
  if (i.paused) return ['statusPaused', 'var(--muted)'];
  if (i.start) return ['statusActive', 'var(--s1)'];
  return ['statusOpen', 'var(--axis)'];
}

function itemsTable(p) {
  const cols = [
    ['status', t('status')], ['title', t('item')], ['points', t('size'), 'num'], ['decided', t('decided')], ['finished', t('finished')], ['lead', t('lead'), 'num'], ['usd', t('cost'), 'num'],
  ];
  const val = (i, k) => k === 'finished' ? (i.done || i.cut || '') : k === 'lead' ? (i.leadDays ?? i.ageDays ?? -1) : k === 'status' ? statusOf(i)[0] : i[k] ?? '';
  const q = st.q.toLowerCase();
  const rows = p.items.filter((i) => !q || i.title.toLowerCase().includes(q) || i.key.toLowerCase().includes(q))
    .sort((a, b) => { const x = val(a, st.sort), y = val(b, st.sort); return (x > y ? 1 : x < y ? -1 : 0) * st.dir; });
  const search = el('input', { type: 'search', placeholder: t('search'), value: st.q, style: 'min-width:200px' });
  search.addEventListener('input', (e) => { st.q = e.target.value; const pos = e.target.selectionStart; update(); const s = document.querySelector('#detail input[type=search]'); if (s) { s.focus(); s.setSelectionRange(pos, pos); } });
  const body = el('tbody');
  for (const i of rows) {
    const [sk, color] = statusOf(i);
    const lead = i.leadDays != null ? `${i.leadDays}${t('days')}` : i.ageDays != null ? `${i.ageDays}${t('days')} ${t('ago')}` : '';
    const tr = el('tr', { class: 'item', tabindex: 0, 'aria-expanded': String(st.open.includes(i.key)) },
      el('td', {}, el('span', { class: 'status' }, el('i', { style: `background:${color}` }), t(sk))),
      el('td', { class: 'title' }, i.title, el('span', { class: 'chip' }, i.key.startsWith('~') ? '—' : i.key)),
      el('td', { class: 'num' }, `${i.size} · ${i.points}`),
      el('td', {}, i.decided || ''),
      el('td', {}, i.done || i.cut || ''),
      el('td', { class: 'num' }, lead),
      el('td', { class: 'num' }, i.usd ? fmtUsdShort(i.usd) : ''));
    const toggle = () => { st.open = st.open.includes(i.key) ? st.open.filter((k) => k !== i.key) : [...st.open, i.key]; update(); };
    tr.addEventListener('click', toggle);
    tr.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
    body.append(tr);
    if (st.open.includes(i.key)) {
      body.append(el('tr', { class: 'detail' }, el('td', { colspan: cols.length }, [
        i.group ? i.group : null,
        i.parent ? `${t('parent')} {${i.parent}}` : null,
        i.start ? `${t('start')} ${i.start}` : null,
        i.paused ? `${t('paused')} ${i.paused}` : null,
        i.usd ? `${t('cost')} ${fmtUsd(i.usd)}${i.usdViaCommits ? ` (${fmtUsd(i.usdViaCommits)} ${t('viaCommits')})` : ''}` : null,
      ].filter(Boolean).join(' · ') || '—')));
    }
  }
  return el('section', { class: 'card' },
    el('div', { class: 'card-head' }, el('h2', {}, `${t('items')} (${p.items.length})`), el('span', { class: 'spacer' }), search),
    p.spend.total ? el('p', { class: 'sub' }, `${t('outside')}: ${fmtUsd(p.spend.outside)}${p.spend.taggedCommits ? ` · ${p.spend.taggedCommits} ${t('viaCommits')}` : ''}`) : null,
    el('div', { style: 'overflow-x:auto' }, el('table', {},
      el('thead', {}, el('tr', {}, cols.map(([k, label, cls]) => el('th', { class: cls, 'aria-sort': st.sort === k ? (st.dir > 0 ? 'ascending' : 'descending') : null },
        el('button', { onclick: () => { if (st.sort === k) st.dir = -st.dir; else { st.sort = k; st.dir = k === 'usd' || k === 'lead' ? -1 : 1; } update(); } }, label + (st.sort === k ? (st.dir > 0 ? ' ↑' : ' ↓') : '')))))),
      body)));
}

// ---------- main ----------
function update() {
  writeHash();
  renderControls();
  const rows = filteredRows();
  renderTiles(rows);
  renderDaily(rows);
  renderByProject(rows);
  renderCards();
  renderDetail();
  $('foot').textContent = `${t('prices')}: ${DATA.prices.source} (${DATA.prices.checked})${DATA.prices.unpriced.length ? ` · ${t('unpriced')}: ${DATA.prices.unpriced.join(', ')}` : ''} · scopeburn`;
}
let rt;
addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(update, 150); });
addEventListener('hashchange', () => { readHash(); update(); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', update);
update();
if (LIVE) setInterval(async () => {
  try { const r = await fetch('data.json', { cache: 'no-store' }); if (r.ok) { DATA = await r.json(); update(); } } catch {}
}, 60000);
})();
</script>
</body>
</html>
